<title>深夜便利店</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:#04070d;color:#dfe8f5;overflow:hidden;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;
  background:#0a0f1a;position:relative}
#titleScreen{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 24px;z-index:40;

             linear-gradient(180deg,#05090f,#0a1220 60%,#0e1626)}
#titleScreen.on{display:flex;animation:fadein .5s}
.t-title{font-size:26px;font-weight:600;letter-spacing:5px;color:#ffd08a;margin-bottom:6px;text-align:center}
.t-sub{font-size:12px;color:#6d80a0;letter-spacing:3px;margin-bottom:44px}
.t-btn{width:100%;max-width:260px;background:#131d30;border:1px solid #2f4066;
  border-radius:9px;padding:15px;font-size:14px;color:#dfe8f5;font-family:inherit;
  cursor:pointer;margin-bottom:11px;transition:.15s;letter-spacing:1px}
.t-btn:active{background:#1e2c48;transform:scale(.98)}
.t-btn.primary{background:linear-gradient(135deg,#3a2a18,#5a3d1f);color:#ffd08a;
  border-color:#6b4a24;font-weight:600}
.t-hint{font-size:11px;color:#4a5a72;margin-top:16px;text-align:center;line-height:1.7}
#hud{flex:none;background:#070c16;border-bottom:1px solid #16213a;padding:8px 12px;
  font-size:11.5px;color:#7f8fa8;line-height:1.8}
#hud .row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
#hud .sep{color:#1d2a44}

#scene{flex:1;overflow-y:auto;padding:12px 13px 8px;
  background:linear-gradient(180deg,#070c16,#0d1524 60%,#111a2b)}

#dayTitle b{color:#ffd08a;font-size:17px;font-weight:600;margin:0 3px}

.g-top{display:flex;align-items:center;gap:9px;margin-bottom:7px}

#actions.four .btn{flex:1 1 calc(50% - 4px)}
.btn-door{background:#1a1a2e;color:#b89fe8;border:1px solid #3a3050}
.btn-door:active{background:#252540}
.btn-buy{background:#16233a;color:#a8c4e8;border:1px solid #24344f}
.btn-buy:active{background:#1d2c48}
.btn-tidy{background:#16233a;color:#9fd8b8;border:1px solid #24344f}
.btn-tidy:active{background:#1d2c48}

  border:1px solid #6b4a24;font-weight:600}

#modal{position:absolute;inset:0;background:rgba(3,6,12,.88);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:20px;z-index:50}

@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal-box{width:100%;max-width:400px;background:#0d1626;border:1px solid #24344f;
  border-radius:12px;padding:18px 16px;max-height:82%;overflow-y:auto;

@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.m-title{font-size:15px;font-weight:600;color:#ffd08a;margin-bottom:6px}
.m-scene{font-size:12.5px;color:#8fa3bd;line-height:1.7;margin-bottom:14px;

.m-res{font-size:12.5px;line-height:1.8;color:#9fb2cc;margin-bottom:14px}

.m-btn{width:100%;background:#1e2c48;border:1px solid #3a4d70;border-radius:8px;
  padding:12px;font-size:13px;color:#ffd08a;font-family:inherit;cursor:pointer;font-weight:600}
.m-btn:active{background:#2a3a5c}
.settle-title{font-size:14px;color:#ffd08a;font-weight:600;margin:14px 0 8px}
.settle-title:first-child{margin-top:0}

.settle-row .no{color:#e88f9a}
.notice{margin-top:12px;padding:9px 11px;border-radius:7px;font-size:12px;

.notice.blue{background:#0d1a2e;border-color:#24344f;color:#9fb2cc}
.end-box{text-align:center}
.end-label{font-size:11px;letter-spacing:3px;color:#6d80a0;margin-bottom:8px}
.end-name{font-size:20px;font-weight:600;color:#ffd08a;margin-bottom:4px}
.end-char{font-size:12px;color:#8fa3bd;margin-bottom:16px}
.end-text{font-size:13px;line-height:2;color:#c6d4e6;text-align:left;

.end-after .t{font-size:11px;color:#6d80a0;margin-bottom:6px;letter-spacing:2px}
.end-after .x{font-size:12px;color:#7d8ca3;line-height:1.8}
.end-actions{display:flex;gap:8px;margin-top:16px}
.end-actions .m-btn{flex:1;margin:0}
.col-section{margin-bottom:16px}
.col-sec-title{font-size:12px;color:#ffd08a;letter-spacing:2px;font-weight:600;
  margin-bottom:8px;padding-left:7px;border-left:2px solid #6b4a24}
.col-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.col-item{background:#0a1220;border:1px solid #1d2c48;border-radius:7px;

  transition:.2s}
.col-item.locked{opacity:.35}
.col-item.unlocked{border-color:#3a4d70}
.col-item.is-new{border-color:#ffd08a;box-shadow:0 0 0 1px rgba(255,208,138,.4),
  inset 0 0 16px rgba(255,208,138,.1);animation:newglow 2s ease-in-out infinite}
@keyframes newglow{0%,100%{box-shadow:0 0 0 1px rgba(255,208,138,.4),inset 0 0 16px rgba(255,208,138,.1)}
  50%{box-shadow:0 0 0 1px rgba(255,208,138,.8),inset 0 0 20px rgba(255,208,138,.2)}}
.col-icon{font-size:17px;margin-bottom:4px;line-height:1}
.col-name{font-size:10px;color:#c6d4e6;line-height:1.3}
.col-item.locked .col-name{color:#4a5a72}
.col-tip{font-size:9px;color:#5f728c;margin-top:2px;line-height:1.3}
.col-item.is-new .col-tip{color:#ffd08a}
.col-count{font-size:11px;color:#6d80a0;text-align:right;margin-bottom:10px}
.col-newhint{font-size:10.5px;color:#ffd08a;margin-bottom:10px;line-height:1.5}
</style>

<body>
<div id="app">
  <div id="titleScreen">
    <div class="t-title">深 夜 便 利 店</div>
    <div class="t-sub">A NIGHT SHIFT</div>
    <button class="t-btn primary" id="btnStart">开始新的一天</button>
    <button class="t-btn" id="btnCollection">回 忆 册</button>
    <div class="t-hint" id="tHint"></div>
  </div>
  <header id="hud"></header>
  <main id="scene">
    <div id="dayTitle"></div>
    <div id="meta"></div>
    <div id="eventBanner"></div>
    <div id="guestArea"></div>
    <div id="logBox"></div>
  </main>
  <footer id="actions"></footer>
  <div id="modal"><div class="modal-box" id="modalBox"></div></div>
</div>

<script>
/* =====================================================
   《深夜便利店》· 设计备忘
   =====================================================
   ① aNights 不能降。
   ② HIT（对话命中率）是最大变量，不是好感数值。
   ③ S_GAIN_PCT 12 是「平价」——best / mid / worst 同价。
      营收 = 服务量；好感 = 服务质量。
   ④ 天气不碰营收。
   ⑤ 营收公式：
        BASE 60 + M_GAIN 8×补货 + S_GAIN 12×专属
      + G_GAIN 4×通用 + REC_GAIN 8×推荐 + 醉客（强硬4/安抚2）
      合格线 100 · A 线 105 · 停电夜合格线 80
   ⑥ TIDY_DECAY 9：30 夜消耗 270，整理 13~14 次 ×18 = 234~252，
      初始可掉 35 → 终值 69~87，刚好压线。
      A 夜：HIT=0.8 实测 9.6（正好卡住 aNights 9），HIT=1 实测 14.9
      （每题都中，A 自然多）。8 太松（A 16.5），10 偏松（A 13.3）。
   ⑦ 整理夜是「合格夜」，不是「不合格夜」：
      1 整理 + 2 专属 = 60 + 24 + 16 = 100，正好压合格线。
      整理吃的是 A 级夜，不是合格。算 tidy 账时不能把整理夜从合格池里扣掉。
   ⑧ 店长检查失败不扣明晚 AP：4AP 夜最高 96 拿不到 100，
      AP−1 等于白送 2 次失败计数。只罚当晚营收/口碑/服务。
   ⑨ 恋人率按档位看，不按单一数字看：60–75% 只是 HIT=0.9 的带。
      HIT=1 完美玩家 ~100% 是奖励；HIT=0.8「完全不看提示」下限 ~65%
      也是合理下限，不是失衡——真实玩家有熟悉度微亮，实际 HIT 在 0.85+，
      体验高于这个下限。「HIT=0.8 必须 20–30%」已撤回：那要把 aNights
      抬到 11（32%），变成卡数值而不是卡理解。淡淡的遗憾来自余波与林屿线的错过。
   ⑩ stockFactor 必须在 calcRevenuePct 里乘，不能只在面板里乘：
      显示和实际必须同一套公式（曾经面板写 ×0.85、calcRevenue 没乘）。已修，不许回退。
   ⑪ 林川 appearRate 0.65 是叙事值，不是调参：急诊科主治医师「几乎每日必到」，
      0.6 偏低。它同时是林屿线的入口，实测把林屿解锁抬到 15–19%（原 11%）。
   ⑫ 「中位」类指标也要先问档位：苏妄好感中位 HIT=1 → 73（落在 65–72 带内），
      HIT=0.8 → 51。所有中位/比率指标先问「这是给哪档玩家的」再定数。
      （这是第三次跨档定错目标，前两次：恋人带 60–75%、A 夜 9.9。）
   ⑬ 苏妄 appearRate 停在 0.55，不上 0.65：0.65 与林川同档，会抹掉
      「无固定规律、失眠或卡文才出现」的不确定感。完美玩家恋人 43.5%
      不是没解决，是这条线该有的难度——「选对了还是打不出来」
      正是他想让玩家体会的：不是不心动，是不敢。
   ⑭ 林屿线是「探索流」，不是「事件流」。玩家先注意到门口有人（层 0），
      再见到但不可攻略（层 1），老照片后正式可攻略（层 2），
      三次互动后坦白（层 3）。不设「林川好感 75」门槛：
      入口是「注意到他」，不是「攻略他弟弟」。
   ⑮ yuState 状态机（1 的旧语义「阶段 A 已触发」已废弃，checkYuStageA 已删）：
      0 = 未出现（点「去门口看看」累积 yuLookCount，满 3 次进 1）
      1 = 已见到但不可攻略（每晚 45% 出现，买热牛奶，不能互动）
      2 = 可攻略，互动 0 次（老照片已看；3 的计数器见 yuState）
      3 = 可攻略，互动 1 次
      4 = 可攻略，互动 2 次
      5 = 可攻略，互动 3 次，下次打烊坦白
      6 = 已坦白，正式解锁（每晚被动 +1）
      分寸：打烊轮选对 +1（免费） / 「看向门口」选对 +2（0AP，叠加不替代） /
      坦白 +4 / 解锁后每晚 +1。门槛 YU_SCORE_LOVER = 19、YU_SCORE_FRIEND = 16，
      另加显式条件 yuActCount ≥ 2 且只拦恋人（见 ⑳㉑㉒）。
      老照片是 1 → 2 的唯一钥匙，不是好感门槛。
   ⑯ 层 0「去门口看看」不消耗 AP：它是叙事入口，不是资源取舍。
      满 3 次时若 photoDone 已真，直接进层 2（不再等 45% 出场）。
      「一晚一件事」的取舍发生在补货/整理/互动/看向门口，
      不发生在「注意到门口有个人」。实测 3AP 代价曾让陆则衍恋人 −12.7pt。
      代价改为「每晚限 1 次」（yuLookNight 存夜晚号，刷新不可重复点），查看满 3 次 = 3 个晚上。
   ⑰ 林屿好友率目标 18–25%，不是 30–45%：
      好友率高意味着「错过」不痛，违背隐藏线的调性。
      林屿是「大多数人没注意到」的线，不是「人人能拿好友」的线。
      （好友 ≈ 解锁 − 恋人：解锁 35–40%、恋人 10–15% → 好友 20–25%）
   ⑱ （已作废，保留作过程记录）原设 YU_SCORE_LOVER = 16，想让全被动够不到。
      实测不成立：全被动尾到 19 分（早解锁局还有 12–14 晚 ×+1），
      且被动与主动最多只差 3 次 ×2 = 6 分。任何能让主动落到 10–15% 的
      分数门槛，都会把被动一起带进来。改用 ⑳ 的显式条件 + ㉑ 的有效门槛。
   ⑲ 林屿线的取舍是「注意力」不是「资源」：
      层 0「去门口看看」、层 2「看向门口」，都是 0AP。
      1AP 会让它变成「拿关店换分寸」，实测主动 3 次关门率 54.1%。
      注意力分配不能有资源代价，否则玩家先出局，根本没到结算。
   ⑳ 「全被动 0%」用显式条件，不用分数门槛：
      被动与主动分数差最多 6 分，任何让主动到 10–15% 的门槛都会把被动带进来。
      yuActCount >= 2 是布尔条件，不参与分数计算（在 finalYuEnding 里先行判定）。
   ㉑ 门槛 13 是数学 bug：层 2→5 确定性分值 = 打烊 3 + 主动 6 + 坦白 4 = 13，
      13 等于保底值，等于没门槛（实测解锁者 90%+ 是恋人）。
      恋人 19 / 好友 16 才是有效门槛。
   ㉒ 显式条件 yuActCount 只拦恋人，不拦好友：
      全被动 = 「你一直没主动注意过他」，他搬走，但你们认识——够好友。
      好友是「认识」，恋人是「主动」。全被动天花板 = yu_friend。
   ㉓ 模拟器 DOM stub 的 innerHTML 不清 _q、readyModal 不看 .on，
      会导致同一夜 doSettlement 跑两次（64% 局命中）。
      上一轮「主动 3 次关门 54%」是假象，真值 1.1%。
      教训：模拟器 bug 会伪装成设计结论，报「结构性问题」前先验 harness。
   ㉔ 老照片窗口定为 [12,19]（砍掉 [12,22] 的尾部 3 天），林川门槛保持 35：
      照片率 39.9% ≈ 林屿解锁 38.6%，同时把林川从 49% 压到 40.7%、陆则衍 68.3 → 67.2。
      一个改动解决两件事。窗口可以收窄，但不能太晚：
      [12,21]+40 的照片率 36.3% 同样达标，但解锁日推到 22.6、分寸只剩 5.39，
      林屿恋人崩到 3.5%——照片率达标不等于林屿线达标，解锁时间点同样关键。
   ㉕ 林川恋人 40% 来自稀有事件的频率，不是老照片：
      把照片的 +15 砍到 +8，恋人 52.2%（没降）；照片完全不发生，恋人 50.6%（也没降）。
      稀有事件同时给 +15 好感和一段心事，所以「好感≥80」与「心事=3」两条线一起涨
      （实测 66.8% / 67.0%，几乎重合）。
      要压林川只能动「稀有事件给林川的心事」或 LOVER_GATE，动照片是无效的。
      这条以后别再试。
   ㉖ 林川恋人目标 30% 撤回，改为 35–45%：
      30% 是 harness 有 bug 时定的。修复后四角色梯度
      陆则衍 67% > 林川 41% > 苏妄 13% > 陈术 11%，

function favorGain(diff, type, rank){
  if(type==='special'){
    if(rank==='best') return 2;
    /* hard（苏妄）：专属是「读懂了」的时刻，mid/worst 都不倒扣；
       他的难在搭话——抗拒闲聊，说错就合上本子（见下面的 general 分支）。 */
    if(diff==='hard') return 0;
    return rank==='mid'?1:0;
  }else{
    if(diff==='hard') return rank==='best'?1:rank==='mid'?0:-1;
    return rank==='best'?1:0;
  }
}
function tierOf(f){
  if(f>=80) return '心动';
  if(f>=56) return '在意';
  if(f>=36) return '熟客';
  if(f>=16) return '眼熟';
  return '陌生';
}
function tierColor(f){
  if(f>=80) return '#ff8fa3';
  if(f>=56) return '#ffb36b';
  if(f>=36) return '#8fd6a8';
  return '#7f8fa8';
}
function getCharHint(id){
  const c = CHARS[id];
  return S.favors[id] >= 36 ? c.hintClose : c.hintEarly;
}

let COL = {};
function loadCollection(){
  try {
    const raw = localStorage.getItem(COLLECTION_KEY);
    COL = raw ? JSON.parse(raw) : {};
  } catch(e){ COL = {}; }
  if(!COL.hearts) COL.hearts = {};
  if(!COL.rare) COL.rare = {};
  if(!COL.endings) COL.endings = {};
  if(!COL.events) COL.events = {};
  if(!COL.yuHearts) COL.yuHearts = {};
}
function saveCollection(){
  try { localStorage.setItem(COLLECTION_KEY, JSON.stringify(COL)); } catch(e){}
}
function markNew(kind, key){
  if(!S.newUnlocks) return;
  if(kind === 'yuHearts'){ S.newUnlocks.yuHearts[key] = true; return; }
  if(!S.newUnlocks[kind]) S.newUnlocks[kind] = {};
  S.newUnlocks[kind][key] = true;
}
function recordHeart(id, idx){
  if(!COL.hearts[id]) COL.hearts[id] = {};
  const isNew = !COL.hearts[id][idx];
  COL.hearts[id][idx] = true; saveCollection();
  if(isNew) markNew('hearts', id+'_'+idx);
}
function recordRare(id){
  const isNew = !COL.rare[id];
  COL.rare[id] = true; saveCollection();
  if(isNew) markNew('rare', id);
}
function recordEvent(k){
  const isNew = !COL.events[k];
  COL.events[k] = true; saveCollection();
  if(isNew) markNew('events', k);
}
function recordYuHeart(idx){
  const isNew = !COL.yuHearts[idx];
  COL.yuHearts[idx] = true; saveCollection();
  if(isNew) markNew('yuHearts', idx);
}
function recordEnding(type, charId){
  const key = charId ? type+'_'+charId : type;
  const isNew = !COL.endings[key];
  COL.endings[key] = true; saveCollection();
  // 只有会出现在回忆册里的结局才标「新」；closed / none 无对应格子
  if(isNew && (charId || type.indexOf('yu_') === 0)) markNew('endings', key);
}

function collectionStats(){
  let total=0, got=0;
  COL_DATA.chars.forEach(c=>{
    c.hearts.forEach((_,i)=>{ total++; if(COL.hearts[c.id] && COL.hearts[c.id][i]) got++; });
    total++; if(COL.rare[c.id]) got++;
    Object.keys(c.endings).forEach(k=>{ total++; if(COL.endings[k+'_'+c.id]) got++; });
  });
  COL_DATA.yu.hearts.forEach((_,i)=>{ total++; if(COL.yuHearts[i]) got++; });
  Object.keys(COL_DATA.yu.endings).forEach(k=>{ total++; if(COL.endings['yu_'+k]) got++; });
  COL_DATA.events.forEach(e=>{ total++; if(COL.events[e.id]) got++; });
  return { total, got };
}

    const key = 'yu_'+k;
    const ok = COL.endings[key];
    const isNew = nu && nu.endings[key];
    const label = k==='lover'?'恋人':k==='friend'?'好友':'错过';
    html += `<div class="${cls('col-item '+(ok?'unlocked':'locked'), isNew)}">

function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// 一次性点击：防止移动端快速双击导致重复扣 AP / 重复计推荐 / 连跳多夜
function once(fn){ let used=false; return ()=>{ if(used) return; used=true; return fn(); }; }
function computeApMax(){
  let ap = 5;
  if(S.storm) ap++;
  if(S.pendingApPenalty) ap -= S.pendingApPenalty;
  return Math.max(3, ap);
}

function save(){
  const data = {
    day:S.day, tidy:S.tidy, stock:S.stock, rep:S.rep, service:S.service,
    favors:S.favors, hearts:S.hearts, rareDone:S.rareDone, rarePity:S.rarePity,
    lastSeen:S.lastSeen, dialogIdx:S.dialogIdx, heartQueue:S.heartQueue,
    present:S.present, night:S.night, week:S.week,
    qualified:S.qualified, aNights:S.aNights, failStreak:S.failStreak,
    logs:S.logs, nightHistory:S.nightHistory,
    weather:S.weather, blackout:S.blackout, storm:S.storm,
    drunk:S.drunk, drunkHandled:S.drunkHandled, drunkBonus:S.drunkBonus,
    drunkSuccess:S.drunkSuccess, inspectResult:S.inspectResult,
    pendingApPenalty:S.pendingApPenalty, pendingSettle:S.pendingSettle,
    apMax:S.apMax, ap:S.ap,
    yuState:S.yuState, yuScore:S.yuScore, yuCorrect:S.yuCorrect,
    yuHearts:S.yuHearts, yuHeartQueue:S.yuHeartQueue,
    yuLookCount:S.yuLookCount, yuSeen:S.yuSeen,
    yuLookNight:S.yuLookNight, yuHintTonight:S.yuHintTonight,
    yuActCount:S.yuActCount,
    pendingPhoto:S.pendingPhoto, photoDone:S.photoDone, yuInNight:S.yuInNight,
    yuShown:S.yuShown, newUnlocks:S.newUnlocks
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch(e){}
}
function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d.hearts) d.hearts = {};
    if(!d.dialogIdx) d.dialogIdx = {};
    if(!d.heartQueue) d.heartQueue = {};
    if(!d.favors) d.favors = {};
    if(!d.night) d.night = { manage:0, special:0, general:0, rec:0 };
    if(!d.week) d.week = { rec:0, general:0 };
    if(d.yuHearts === undefined) d.yuHearts = 0;
    if(!d.yuHeartQueue) d.yuHeartQueue = [];
    if(d.yuShown === undefined) d.yuShown = false;
    if(d.yuLookCount === undefined) d.yuLookCount = 0;
    if(d.yuSeen === undefined) d.yuSeen = 0;
    if(d.yuLookNight === undefined) d.yuLookNight = -1;
    if(d.yuLookTonight === true && d.yuLookNight === -1) d.yuLookNight = d.day;  // 旧档：把那晚算作已看
    if(d.yuLookTonight !== undefined) delete d.yuLookTonight;
    if(d.yuHintTonight === undefined) d.yuHintTonight = false;
    if(d.yuActCount === undefined) d.yuActCount = 0;
    if(d.pendingSettle === undefined) d.pendingSettle = false;
    if(d.stock === undefined) d.stock = STOCK_INIT;
    if(!d.newUnlocks) d.newUnlocks = { hearts:{}, rare:{}, endings:{}, events:{}, yuHearts:{} };
    CHAR_IDS.forEach(id=>{
      if(d.favors[id] === undefined) d.favors[id] = 0;
      if(d.hearts[id] === undefined) d.hearts[id] = 0;
      if(!d.dialogIdx[id]) d.dialogIdx[id] = { special:0, general:0 };
      if(!d.heartQueue[id]) d.heartQueue[id] = [];
    });
    Object.assign(S, d);
    return true;
  } catch(e){ return false; }
}
function clearSave(){
  try { localStorage.removeItem(SAVE_KEY); } catch(e){}
}

function rollWeatherAndEvents(){
  S.weather = Math.random() < 0.30 ? 'rain' : 'clear';
  S.blackout = false; S.storm = false;
  S.drunk = false; S.drunkHandled = false;
  S.drunkBonus = 0; S.drunkSuccess = false;
  S.inspectResult = null; S.yuInNight = false; S.yuShown = false;
  if(S.day >= 6 && S.day <= 25 && Math.random() < 0.08){
    S.blackout = true; recordEvent('blackout'); return;
  }
  if(S.weather === 'rain' && Math.random() < 0.15){
    S.storm = true; recordEvent('storm'); return;
  }
  if(S.day >= 6 && S.day <= 25 && !S.blackout){
    const base = S.tidy < TIDY_TARGET ? 0.20 : 0.10;
    if(Math.random() < base){ S.drunk = true; recordEvent('drunk'); }
  }
}

  const passLine = S.blackout ? BLACKOUT_PASS_PCT : PASS_PCT;
  const tidyCls = S.tidy >= TIDY_TARGET ? '#8fd6a8' : S.tidy >= TIDY_TARGET-15 ? '#ffd08a' : '#e88f9a';
  const pctCls  = pct >= A_PCT ? '#8fd6a8' : pct >= passLine ? '#ffd08a' : '#e88f9a';
  const stockCls = S.stock >= 50 ? '#8fd6a8' : S.stock >= 25 ? '#ffd08a' : '#e88f9a';
  const wIcon = S.weather === 'rain' ? '🌧' : '☀';
  $('#hud').innerHTML = `
    <div class="row">
      <span>第 <b>${S.day}</b>/${TOTAL_DAYS} 夜 ${wIcon}</span>
      <span class="sep">|</span>
      <span>AP <b>${S.ap}</b>/${S.apMax}</span>
      <span class="sep">|</span>
      <span>合格 <b>${S.qualified}</b>/${LOVER_GATE.qualified} · A级 <b>${S.aNights}</b>/${LOVER_GATE.aNights}</span>
    </div>
    <div class="row" style="margin-top:2px">
      <span style="color:${pctCls}">营收 <b style="color:${pctCls}">${pct}%</b>${S.blackout?' <span style="color:#6d80a0">/线80</span>':''}</span>
      <span class="sep">|</span>
      <span style="color:${tidyCls}">整洁 <b style="color:${tidyCls}">${S.tidy}</b></span>
      <span class="sep">|</span>
      <span style="color:${stockCls}">货架 <b style="color:${stockCls}">${S.stock}</b></span>
      <span class="sep">|</span>
      <span>口碑 <b>${S.rep}</b>${S.rep>=YU_REP_GATE?' <span style="color:#8fd6a8">✦</span>':''}</span>
      <span class="sep">|</span>
      <span>服务 <b>${S.service}</b>${S.service>=YU_SVC_GATE?' <span style="color:#8fd6a8">✦</span>':''}</span>
    </div>`;
}
function calcRevenuePct(){
  const base = Math.round(
    BASE_PCT
    + M_GAIN_PCT * S.night.manage
    + S_GAIN_PCT * S.night.special
    + G_GAIN_PCT * S.night.general
    + REC_GAIN_PCT * S.night.rec
    + S.drunkBonus
  );
  return Math.round(base * stockFactor());
}
function calcRevenue(pct){
  const p = (pct!==undefined?pct:calcRevenuePct());
  return Math.floor(revenueTarget(S.day) * p / 100);
}
function addLog(text, cls){
  S.logs.unshift({ text, cls: cls||'' });
  if(S.logs.length > 14) S.logs.pop();
  renderLogs();
}
function renderLogs(){
  $('#logBox').innerHTML = S.logs.map(l=>`<div class="log ${l.cls}">${l.text}</div>`).join('');
}
function renderBanner(){
  const b = $('#eventBanner'); b.innerHTML = '';
  if(S.blackout){
    b.innerHTML = `<div class="notice blue">⚠ 深夜停电。补货不可用，整理只 +6。今晚合格线降至 <b>80%</b>，A 级线不变。</div>`;
  }else if(S.storm){
    b.innerHTML = `<div class="notice gold">⚠ 暴雨封路。客人滞留，今晚 AP +1。</div>`;
  }else if(S.drunk){
    b.innerHTML = `<div class="notice">⚠ 门口有个喝多了的人在晃。打烊前得处理。</div>`;
  }else if(S.yuHintTonight){
    /* 层 0 暗示（每晚只掷一次，见 nextDay）：当晚顶掉天气横幅，天气仍在标题行 */
    b.innerHTML = `<div class="notice blue">门口好像站着一个人。等你再看，只剩雨。</div>`;
  }else if(S.weather === 'rain'){
    b.innerHTML = `<div class="notice blue">🌧 小雨。玻璃上起了雾，雨声很轻。苏妄大概会来。</div>`;
  }else if(S.weather === 'clear'){
    b.innerHTML = `<div class="notice gold">☀ 晴。街上比平时热闹些，偶尔有人推门进来。</div>`;
  }
}
function renderNight(){
  const weatherName = S.blackout ? '深夜停电' : S.storm ? '暴雨' : S.weather === 'rain' ? '小雨' : '晴';
  $('#dayTitle').innerHTML = `第 <b>${S.day}</b> 夜 · 22:00 · ${weatherName}`;
  $('#meta').innerHTML = `目标营业额 ${revenueTarget(S.day)} · 整洁需 ≥${TIDY_TARGET} · 货架每晚 −${STOCK_DECAY} · 整洁每晚 −${TIDY_DECAY}`;
  renderBanner();

  if(S.present.length === 0) ga.appendChild(el('div', 'log', '今晚没有客人来。店很安静。'));
  S.present.forEach(id=>{
    const c = CHARS[id], f = S.favors[id];
    const isSuRain = S.weather === 'rain' && id === 'su';
    const card = el('div','guest');
    card.innerHTML = `
      <div class="g-top">
        <div class="avatar" style="background:${c.color}">${c.name[0]}</div>
        <div><div class="g-name">${c.name}</div><div class="g-title">${c.title}</div></div>
        <div class="g-favor">
          <div class="g-tier" style="color:${tierColor(f)}">${tierOf(f)}</div>
          <div class="g-num">好感 ${f}</div>
        </div>
      </div>
      <div class="g-bar"><i style="width:${f}%;background:${tierColor(f)}"></i></div>
      <div class="g-hint">${getCharHint(id)}</div>
      ${isSuRain?`<div class="g-rain">🌧 雨声让他放松，今晚说错话，他也不会介意。</div>`:''}
      <div class="g-btns">
        <button class="btn btn-spec" data-id="${id}" data-type="special" ${S.ap<2?'disabled':''}>互动 · 2AP</button>
        <button class="btn btn-gen"  data-id="${id}" data-type="general" ${S.ap<1?'disabled':''}>搭话 · 1AP</button>
      </div>`;
    ga.appendChild(card);
  });
  ga.querySelectorAll('button[data-id]').forEach(b=>{
    b.onclick = ()=>openDialog(b.dataset.id, b.dataset.type);
  });
  renderActions();

function renderActions(){
  const a = $('#actions');
  const buyDisabled = S.ap<1 || S.blackout;
  const tidyDisabled = S.ap<1;
  const stockWarn = S.stock >= STOCK_FULL ? '（已满）' : '';

  /* 门口按钮：层 0「去门口看看」/ 层 2「看向门口」，都是 0AP，每晚各一次 */
  let doorBtn = '';
  const canLook0 = S.yuState === 0 && S.day >= 6 && S.yuLookNight !== S.day;
  const canLook2 = S.yuState >= 2 && S.yuState <= 4 && S.yuLookNight !== S.day;
  if(canLook0){
    doorBtn = `<button class="btn btn-door" id="btnDoor">去门口看看</button>`;
  }else if(canLook2){
    doorBtn = `<button class="btn btn-door" id="btnDoor">看向门口</button>`;
  }
  if(doorBtn) a.classList.add('four'); else a.classList.remove('four');

  a.innerHTML = `
    <button class="btn btn-buy"  id="btnBuy"  ${buyDisabled?'disabled':''}>补货 · 1AP${stockWarn}</button>
    <button class="btn btn-tidy" id="btnTidy" ${tidyDisabled?'disabled':''}>整理 · 1AP${S.blackout?'(+6)':''}</button>
    ${doorBtn}
    <button class="btn btn-close" id="btnClose">打烊</button>`;
  $('#btnBuy').onclick  = doRestock;
  $('#btnTidy').onclick = doTidy;
  $('#btnClose').onclick= closeShop;
  const db = $('#btnDoor');
  if(db) db.onclick = ()=>{
    if(S.yuState === 0) doLookAtDoor();
    else showYuLookDialog();
  };
}

function doRestock(){
  if(S.ap < 1 || S.blackout) return;
  S.ap--; S.night.manage++;
  const before = S.stock;
  S.stock = clamp(S.stock + STOCK_RESTOCK, 0, STOCK_FULL);
  const gained = S.stock - before;
  if(gained === 0) addLog('货架本来就是满的，你只是象征性地整理了一下。', '');
  else addLog(`你补了货，货架 +${gained}。`, 'up');
  renderNight();
}
function doTidy(){
  if(S.ap < 1) return;
  S.ap--;
  const before = S.tidy;
  const amount = S.blackout ? TIDY_BLACKOUT : TIDY_MANAGE;
  S.tidy = clamp(S.tidy + amount, 0, 100);
  const gained = S.tidy - before;
  addLog(S.blackout
    ? `点着应急灯擦了货架，整洁 +${gained}。`
    : `你整理了货架，整洁 +${gained}。`, gained>0?'up':'');
  renderNight();
}

function openDialog(id, type){
  const cost = type==='special' ? 2 : 1;
  if(S.ap < cost){ addLog('行动点不够了。','down'); return; }
  const c = CHARS[id];
  const pool = type==='special' ? c.special : c.general;
  const idx = S.dialogIdx[id][type] % pool.length;
  S.dialogIdx[id][type]++;
  const d = pool[idx];
  const isFamiliar = S.favors[id] >= FAMILIAR_FAVOR;
  const shuffledOpts = shuffle([...d.o]);

  const box = $('#modalBox');
  box.innerHTML = `
    <div class="m-title">${c.name} · ${type==='special'?'互动':'搭话'}</div>
    <div class="m-scene">${d.s}</div>
    <div id="optWrap"></div>`;
  const ow = box.querySelector('#optWrap');
  shuffledOpts.forEach(opt=>{
    const b = el('button','opt', opt.t);
    if(isFamiliar && opt.r === 'best'){
      b.style.color = '#d8e4f2';
      b.style.borderColor = '#2f4066';
    }
    b.onclick = once(()=>chooseOption(id, type, opt));
    ow.appendChild(b);
  });
  $('#modal').classList.add('on');
}
function queueHearts(id){
  while(S.hearts[id] < 3 && S.favors[id] >= HEART_THRESHOLDS[S.hearts[id]]){
    const idx = S.hearts[id];
    S.heartQueue[id].push(idx);
    recordHeart(id, idx);
    S.hearts[id]++;
    S.favors[id] = clamp(S.favors[id] + 3, 0, 100);
  }
}
function chooseOption(id, type, opt){
  const c = CHARS[id];
  const cost = type==='special' ? 2 : 1;
  S.ap -= cost;
  if(type==='special'){
    S.night.special++;
  }else{
    S.night.general++;
    S.week.general++;
  }
  let gain = favorGain(c.diff, type, opt.r);
  if(S.blackout && gain > 0) gain += 1;
  if(S.weather === 'rain' && id === 'su' && gain < 0) gain = 0;
  S.favors[id] = clamp(S.favors[id] + gain, 0, 100);
  queueHearts(id);

  let res = '';
  if(gain > 0)      res = `<span class="g">好感 +${gain}</span>`;
  else if(gain < 0) res = `<span class="r">好感 ${gain}</span>`;
  else if(S.weather==='rain' && id==='su' && opt.r==='worst')
                    res = `<span style="color:#8fa8d0">好感 ±0（雨声让他没在意）</span>`;
  else              res = `<span style="color:#6d80a0">好感 ±0</span>`;

  const needRec = type==='special' && opt.r==='best';

  const box = $('#modalBox');
  box.innerHTML = `
    <div class="m-title">${c.name}</div>
    <div class="m-res">${res}</div>
    ${needRec?`<div style="font-size:12px;color:#8fa3bd;margin-bottom:10px">他常买的那款，要不要顺手递过去？</div>
    <button class="m-btn" id="mRec" style="margin-bottom:8px">顺手把他常买的递过去</button>
    <button class="m-btn" id="mNoRec" style="background:#131d30;border-color:#1d2c48;color:#9fb2cc">不了，就这样</button>`
    :`<button class="m-btn" id="mOk">继续</button>`}`;
  if(needRec){
    box.querySelector('#mRec').onclick = once(()=>{
      S.night.rec++; S.week.rec++;
      addLog(`${c.name} · 顺手递了常买的，营收 +8%`, 'up');
      proceedAfterDialog(id);
    });
    box.querySelector('#mNoRec').onclick = once(()=> proceedAfterDialog(id));
  }else{
    box.querySelector('#mOk').onclick = once(()=> proceedAfterDialog(id));
  }
  addLog(`${c.name}：${opt.t}`, gain>0?'up':gain<0?'down':'');
  renderHUD();
}
function proceedAfterDialog(id){
  $('#modal').classList.remove('on');
  if(S.heartQueue[id].length > 0) showHeartEvent(id);
  else{
    if(S.ap <= 0) addLog('行动点用完了，该打烊了。');
    renderNight();
  }
}

function showHeartEvent(id){
  const c = CHARS[id];
  const idx = S.heartQueue[id].shift();
  const e = c.heartEvents[idx];
  const box = $('#modalBox');
  box.innerHTML = `
    <div class="m-title">${c.name} · 心事 ${idx+1}</div>
    <div class="m-scene">${e.s}</div>
    <div id="optWrap"></div>`;
  const ow = box.querySelector('#optWrap');
  shuffle([...e.o]).forEach(opt=>{
    const b = el('button','opt', opt.t);
    b.onclick = once(()=> chooseHeart(id, idx, opt));
    ow.appendChild(b);
  });
  $('#modal').classList.add('on');
}
function chooseHeart(id, idx, opt){
  const c = CHARS[id];
  const bonus = opt.r === 'best' ? 2 : 0;
  if(bonus > 0) S.favors[id] = clamp(S.favors[id] + bonus, 0, 100);
  queueHearts(id);
  const box = $('#modalBox');
  box.innerHTML = `
    <div class="m-title">${c.name}</div>
    <div class="m-res">${bonus > 0
      ? `<span class="g">好感额外 +2</span>`
      : `<span style="color:#6d80a0">好感 ±0</span>`}
      <div style="margin-top:10px;font-size:11.5px;color:#6d80a0;line-height:1.7">${c.hearts[idx]}</div>
    </div>
    <button class="m-btn" id="mOk">继续</button>`;
  box.querySelector('#mOk').onclick = ()=>{
    $('#modal').classList.remove('on');
    if(S.heartQueue[id].length > 0) showHeartEvent(id);
    else{
      if(S.ap <= 0) addLog('行动点用完了，该打烊了。');
      renderNight();
    }
  };
  addLog(`${c.name} 的心事 · 第${idx+1}段`, 'gold');
  renderHUD();
}

function showDrunkEvent(){
  recordEvent('drunk');
  const badTidy = S.tidy < TIDY_TARGET;
  const box = $('#modalBox');
  box.innerHTML = `
    <div class="m-title">醉客闹店</div>
    <div class="m-scene">一个喝多了的人推门进来，在货架间大声嚷嚷。${badTidy?'店里本来就乱，他更来劲了。':''}</div>
    <div id="optWrap"></div>`;
  const ow = box.querySelector('#optWrap');
  [
    {t:'强硬驱赶 / 报警', k:'hard'},
    {t:'安抚，递一杯水', k:'soft'},
    {t:'假装没看见', k:'ignore'}
  ].forEach(o=>{
    const b = el('button','opt', o.t);
    b.onclick = ()=> resolveDrunk(o.k);
    ow.appendChild(b);
  });
  $('#modal').classList.add('on');
}
function resolveDrunk(kind){
  const badTidy = S.tidy < TIDY_TARGET;
  let tidyDelta = 0, bonus = 0, msg = '', success = false;
  if(kind === 'hard'){
    if(!badTidy){ bonus = DRUNK_HARD_BONUS; success = true; msg = `你把他请了出去。店里恢复了安静。营业额 +${DRUNK_HARD_BONUS}%。`; }
    else { tidyDelta = -10; msg = '他推了你一把，货架倒了一排。整洁 −10。'; }
  }else if(kind === 'soft'){
    if(!badTidy){ bonus = DRUNK_SOFT_BONUS; tidyDelta = -2; success = true; msg = `他接过水，嘟囔了几句，走了。整洁 −2，营业额 +${DRUNK_SOFT_BONUS}%。`; }
    else { tidyDelta = -8; msg = '他根本没听，撞翻了一排饮料。整洁 −8。'; }
  }else{
    if(!badTidy){ tidyDelta = -2; msg = '他自己晃了两圈，走了。整洁 −2。'; }
    else {
      tidyDelta = -15; msg = '他摔了东西才走。整洁 −15。';
      S.present.forEach(id => S.favors[id] = clamp(S.favors[id] - 1, 0, 100));
      if(S.present.length) msg += ' 在场的客人被吓到了，好感 −1。';
    }
  }
  S.tidy = clamp(S.tidy + tidyDelta, 0, 100);
  S.drunkBonus = bonus;
  S.drunkHandled = true;
  S.drunkSuccess = success;
  if(success) S.rep = clamp(S.rep + 1, 0, 100);
  const box = $('#modalBox');
  box.innerHTML = `
    <div class="m-title">处理结果</div>
    <div class="m-res">${msg}${success?'<br><span class="g">口碑 +1</span>':''}</div>
    <button class="m-btn" id="mOk">继续结算</button>`;
  box.querySelector('#mOk').onclick = ()=>{
    $('#modal').classList.remove('on');
    continueClose();
  };
  addLog(msg, tidyDelta < 0 ? 'down' : 'up');
}

/* ---------- 林屿 · 层 1：见到但不可攻略（yuState = 1）---------- */
function showYuStageB(){
  if(S.yuState !== 1) return false;
  if(S.yuShown) return false;
  S.yuSeen++;
  const box = $('#modalBox');
  const texts = [

function checkManagerInspection(){
  if(S.day !== 10 && S.day !== 20) return null;
  recordEvent('inspect');
  const recent = S.nightHistory.slice(-7);
  const passed = recent.filter(Boolean).length;
  let result;
  if(passed >= 5){
    S.rep = clamp(S.rep + 4, 0, 100);
    S.service = clamp(S.service + 2, 0, 100);
    result = { type:'pass', text:'店长来转了一圈，翻了翻台账，点了点头。口碑 +4，服务 +2。', penalty:0 };
  }else if(passed >= 3){
    result = { type:'ok', text:'店长来转了一圈，没说什么，走了。', penalty:0 };
  }else{
    S.rep = clamp(S.rep - 8, 0, 100);
    S.service = clamp(S.service - 5, 0, 100);
    // 不再扣明晚 AP：4AP 夜数学上无法及格，AP−1 等于白送 2 次失败计数
    result = { type:'fail', text:'店长把台账拍在柜台上：「这个月的数据很难看。再这样下去，你就可以走人了。」<br>今晚营业额 −10%。口碑 −8，服务 −5。', penalty:10 };
  }
  S.inspectResult = result;
  return result;
}

function tryRareEvent(){
  const hits = [];
  S.present.forEach(id=>{
    if(S.rareDone[id]) return;
    const [st, en] = RARE_WINDOWS[id];
    if(S.day < st || S.day > en) return;
    /* 林川门槛 35：稀有事件本身 +15，触发时林川好感基本在 50 以上，
       40 与 35 都过——改的只是「什么时候能触发」（老照片是林屿线的钥匙） */
    if(S.favors[id] < (id === 'lin' ? 35 : 40)) return;
    const pity = S.rarePity[id] || 0;
    if(pity >= 4) hits.push(id);
    else if(Math.random() < 0.25) hits.push(id);
    S.rarePity[id] = pity + 1;
  });
  if(hits.length === 0) return null;
  const id = hits[Math.floor(Math.random()*hits.length)];
  S.rareDone[id] = true;
  S.rarePity[id] = 0;
  S.favors[id] = clamp(S.favors[id] + 15, 0, 100);
  recordRare(id);
  queueHearts(id);
  if(id === 'lin') S.pendingPhoto = true;
  return id;
}

function closeShop(){

    if(S.drunk && !S.drunkHandled){ showDrunkEvent(); return; }
    if(showYuStageCD()) return;
    doSettlement();
  });

function continueClose(){
  if(showYuStageCD()) return;
  doSettlement();
}
function doSettlement(){
  const inspect = checkManagerInspection();
  let pct = calcRevenuePct();
  let inspectPenalty = 0;
  if(inspect && inspect.penalty){ inspectPenalty = inspect.penalty; pct -= inspectPenalty; }
  const target = revenueTarget(S.day);
  const rev = calcRevenue(pct);

  S.stock = clamp(S.stock - STOCK_DECAY, 0, STOCK_FULL);
  S.tidy = clamp(S.tidy - TIDY_DECAY, 0, 100);

  const passLine = S.blackout ? BLACKOUT_PASS_PCT : PASS_PCT;
  const revOk  = pct >= passLine;
  const tidyOk = S.tidy >= TIDY_TARGET;
  const passed = revOk && tidyOk;
  const gradeA = pct >= A_PCT && S.tidy >= TIDY_TARGET;

  if(passed) S.qualified++;
  if(gradeA) S.aNights++;
  S.nightHistory.push(passed);

  let blackoutBonusHtml = '';
  if(S.blackout && passed){
    S.rep = clamp(S.rep + 3, 0, 100);
    blackoutBonusHtml = `<div class="notice blue">停电夜撑过来了。口碑 +3。</div>`;
  }

  const rareId = tryRareEvent();
  let rareHtml = '';
  if(rareId){
    const c = CHARS[rareId];
    rareHtml = `<div class="notice gold">${c.name}：${c.rare}（好感 +15）</div>`;
  }

  let inspectHtml = '';
  if(inspect){
    inspectHtml = `<div class="notice ${inspect.type==='pass'?'gold':inspect.type==='fail'?'':'blue'}">${inspect.text}</div>`;
  }

  if(!passed){
    S.failStreak++;
    if(S.failStreak >= FAIL_LIMIT){
      S.present.forEach(id => S.lastSeen[id] = S.day);
      S.pendingSettle = false;
      clearSave();
      showEnding('closed');
      return;
    }
  }else{
    S.failStreak = 0;
  }

  let weekHtml = '';
  if(S.day===7 || S.day===14 || S.day===21 || S.day===28){
    const regulars = CHAR_IDS.filter(id => S.favors[id] >= 36).length;
    const repUp = clamp(regulars * 2, 3, 15);
    const svcUp = clamp(Math.round(S.week.rec + S.week.general * 0.5), 2, 12);
    S.rep     = clamp(S.rep + repUp, 0, 100);
    S.service = clamp(S.service + svcUp, 0, 100);
    weekHtml = `<div class="notice gold">周结算：口碑 +${repUp} → ${S.rep}｜服务 +${svcUp} → ${S.service}</div>`;
    S.week = { rec:0, general:0 };
  }

  S.present.forEach(id => S.lastSeen[id] = S.day);

  let warnHtml = '';
  if(!passed && S.failStreak >= FAIL_WARN){
    const left = FAIL_LIMIT - S.failStreak;
    warnHtml = `<div class="notice">店长来消息了：「这个月的营收，你打算怎么办？」<br>再有 ${left} 晚不达标，店就要关门。</div>`;
  }

  S.pendingSettle = true;
  save();

  const stockOk = S.stock >= 50;
  const box = $('#modalBox');
  box.innerHTML = `
    <div class="settle-title">第 ${S.day} 夜 · 打烊</div>
    <div class="settle-row"><span>营业额</span><b class="${revOk?'ok':'no'}">${rev} / ${target}（${pct}%）${revOk?' ✓':' ✗'}${S.blackout?' <span style="color:#6d80a0;font-size:11px">/线80</span>':''}</b></div>
    <div class="settle-row"><span>整洁度</span><b class="${tidyOk?'ok':'no'}">${S.tidy} / ${TIDY_TARGET}${tidyOk?' ✓':' ✗'}</b></div>
    <div class="settle-row"><span>货架（明晚）</span><b class="${stockOk?'ok':'no'}">${S.stock} / 50${stockOk?' ✓':' ✗（营收 ×'+stockFactor().toFixed(2)+'）'}</b></div>
    <div class="settle-row"><span>今晚评价</span><b class="${gradeA?'ok':passed?'ok':'no'}">${gradeA?'A 级夜':passed?'合格夜':'不合格'}</b></div>
    <div class="settle-row"><span>累计合格 / A 级</span><b>${S.qualified} / ${LOVER_GATE.qualified} · ${S.aNights} / ${LOVER_GATE.aNights}</b></div>
    ${inspectPenalty?`<div class="settle-row"><span>店长罚金</span><b class="no">−${inspectPenalty}%</b></div>`:''}
    ${weekHtml}${rareHtml}${inspectHtml}${blackoutBonusHtml}${warnHtml}
    <button class="m-btn" id="mNext" style="margin-top:14px">${S.day>=TOTAL_DAYS?'进入结局':'下一天'}</button>`;
  box.querySelector('#mNext').onclick = once(()=>{
    if(!S.pendingSettle) return;   // 双保险：已推进过就不再重复跳夜
    $('#modal').classList.remove('on');
    nextDay();
  });
  $('#modal').classList.add('on');
  addLog(`打烊。营收 ${pct}%，整洁 ${S.tidy}，货架 ${S.stock}。`, passed?'up':'down');
}

function rollVisitors(){
  const pool = [];
  CHAR_IDS.forEach(id=>{
    const c = CHARS[id];
    if(S.day < c.firstDay) return;
    const gap = S.day - S.lastSeen[id];
    let rate = gap >= 4 ? 1 : c.appearRate;
    if(S.weather === 'rain' && id === 'su') rate = Math.max(rate, 0.65);
    if(Math.random() < rate) pool.push(id);
  });
  if(pool.length === 0){
    const cands = CHAR_IDS.filter(id => S.day >= CHARS[id].firstDay);
    if(cands.length) pool.push(cands[Math.floor(Math.random()*cands.length)]);
  }
  if(S.pendingPhoto) pool.push('lin');
  shuffle(pool);
  const result = [];
  const seen = new Set();
  for(const id of pool){
    if(seen.has(id)) continue;
    seen.add(id);
    result.push(id);
    if(result.length >= 3) break;
  }
  if(S.pendingPhoto && !result.includes('lin')){
    result[result.length-1] = 'lin';
  }
  return result;
}

function nextDay(){
  if(S.day >= TOTAL_DAYS){ S.pendingSettle = false; clearSave(); startConfession(); return; }
  S.day++;
  S.pendingSettle = false;
  rollWeatherAndEvents();
  /* 层 0 暗示：每晚只掷一次，结果存进状态，避免 renderBanner 反复随机导致闪烁 */
  S.yuHintTonight = (S.yuState === 0 && S.day >= 6 && Math.random() < YU_HINT_RATE);
  S.apMax = computeApMax();
  S.ap = S.apMax;
  S.night = { manage:0, special:0, general:0, rec:0 };
  S.present = rollVisitors();
  S.logs = [];
  S.pendingApPenalty = 0;
  save();
  renderNight();
  if(tryPhotoScene()) return;
  if(tryYuAppear()) return;
}

function startConfession(){
  if(S.yuState < 6){
    const box = $('#modalBox');
    box.innerHTML = `
      <div class="m-title">第三十夜</div>
      <div class="m-scene">你把最后一盏灯关了。<br><br>门口的街灯还亮着，空荡荡的台阶上，从来没有人站过。<br><br>你总觉得好像错过了什么，却想不起，到底错过了谁。</div>
      <button class="m-btn" id="mOk">打烊</button>`;
    box.querySelector('#mOk').onclick = ()=>{
      $('#modal').classList.remove('on');
      showConfession();
    };
    $('#modal').classList.add('on');
    return;
  }
  showConfession();
}
function showConfession(){
  const box = $('#modalBox');
  const yuEligible = S.yuState === 6 && S.yuScore >= YU_GATE;
  box.innerHTML = `
    <div class="m-title">最后一天</div>
    <div class="m-scene">你站在收银台后。想说点什么的那个人，是谁？</div>
    <div id="optWrap"></div>`;
  const ow = box.querySelector('#optWrap');
  CHAR_IDS.forEach(id=>{
    const c = CHARS[id], f = S.favors[id];
    const hint = (id === 'lin' && f >= 75 && f < 80) ? ' <span style="color:#6d80a0;font-size:11px">（恋人需 80）</span>' : '';
    const b = el('button','opt', `${c.name} · 好感 ${f}（${tierOf(f)}）${hint}`);
    b.onclick = ()=> finalEnding(id);
    ow.appendChild(b);
  });
  if(yuEligible){
    const b = el('button','opt', `林屿 · 分寸 ${S.yuScore}`);
    b.style.background = '#1a1a2e';
    b.style.borderColor = '#6b4a24';
    b.onclick = ()=> finalYuEnding();
    ow.appendChild(b);
  }
  const none = el('button','opt','谁都不选，就这样打烊');
  none.style.color = '#6d80a0';
  none.onclick = ()=> showEnding('none');
  ow.appendChild(none);
  $('#modal').classList.add('on');
}
function finalEnding(id){
  const c = CHARS[id];
  const f = S.favors[id];
  const h = S.hearts[id];
  let type;
  if(f >= LOVER_GATE.favor && h >= LOVER_GATE.hearts
     && S.qualified >= LOVER_GATE.qualified && S.aNights >= LOVER_GATE.aNights){
    type = 'lover';
  }else if(f >= FRIEND_GATE.favor && S.qualified >= FRIEND_GATE.qualified){
    type = 'friend';
  }else{
    type = 'gone';
  }
  const other = CHAR_IDS.find(o => o !== id && S.favors[o] >= AFTERGLOW);
  showEnding(type, id, other);
}
function finalYuEnding(){
  /* 「全被动 0%」用显式条件，不用分数门槛：
     被动与主动分数差最多 6 分，任何让主动到 10–15% 的门槛都会把被动带进来。
     但显式条件只拦恋人，不拦好友（见 ㉒）：
     全被动 = 「你一直没主动注意过他」，他搬走，可你们认识——够好友。
     好友是「认识」，恋人是「主动」。 */
  let type;
  if(!S.yuActCount || S.yuActCount < YU_ACT_GATE){
    type = S.yuScore >= YU_SCORE_FRIEND ? 'yu_friend' : 'yu_gone';
  }else if(S.yuScore >= YU_SCORE_LOVER){
    type = 'yu_lover';
  }else if(S.yuScore >= YU_SCORE_FRIEND){
    type = 'yu_friend';
  }else{
    type = 'yu_gone';
  }
  showEnding(type);
}
function showEnding(type, charId, otherId){
  clearSave();
  recordEnding(type, charId);

  const labelMap = {
    lover:'LOVER', friend:'FRIEND', gone:'GONE', closed:'CLOSED', none:'NOBODY',
    yu_lover:'LOVER · 林屿', yu_friend:'FRIEND · 林屿', yu_gone:'GONE · 林屿'
  };
  const nameMap = {
    lover:'成为恋人', friend:'成为好友', gone:'不再相遇', closed:'店铺关门', none:'谁都没选',
    yu_lover:'成为恋人', yu_friend:'成为好友', yu_gone:'不再相遇'
  };
  let title = '', body = '', after = '';
  if(type === 'closed'){
    title = '店铺关门了';
    body  = '连续四晚不达标。店长收回了钥匙。<br><br>你站在拉下的卷帘门外，雨还没停。玻璃上倒映着店里的灯，一盏接一盏暗下去，<br><br>像那些没说出口的心事，全都沉进了深夜里。';
  }else if(type === 'none'){
    title = '谁都没选';
    body  = '三十个夜晚过去，店还开着。<br><br>熟客来了又走，你始终守在收银台后面，没和谁走得更近。<br><br>关店的时候天快亮了，卷帘门拉下来的声音很轻，像什么都没发生过。';
  }else if(type === 'yu_lover'){
    title = '林屿';
    body  = '他还清最后一笔债务那天，把工作室的注册地址填在了便利店隔壁。<br><br>不再戴口罩压低帽檐，他会在凌晨五点准时推门进来，靠在吧台边等你换班。<br><br>「以后不用躲着了」，他碰了碰你的杯子，声音很轻却很稳，<br><br>「也不用远远看着了。」<br><br>城市的清晨里，三个人的影子都落得安稳。';
  }else if(type === 'yu_friend'){
    title = '林屿';
    body  = '他还完了所有债，不用再躲躲藏藏。<br><br>偶尔会来店里坐会儿，碰到林川也能自然打个招呼。<br><br>每次来都买常温牛奶，站在门口喝半瓶，剩下的带走。<br><br>便利店的灯亮着，他就觉得踏实。';
  }else if(type === 'yu_gone'){
    title = '林屿';
    body  = '他悄无声息地离开了这座城市。<br><br>便利店的灯还是亮的，但门口再也没有徘徊的身影。<br><br>你偶尔会想起，他柠檬味的气息。';
  }else{
    const c = CHARS[charId];
    title = c.name;
    body  = c.endings[type];
    if(otherId){
      const o = CHARS[otherId];
      after = `<div class="end-after">
        <div class="t">余 波</div>
        <div class="x">${o.name}还是会在固定的时间来，买固定的东西，付完钱就走。<br><br>他常坐的位置落了薄灰，你们之间什么都没发生，又好像，发生过什么。</div>
      </div>`;
    }
  }
  const box = $('#modalBox');
  box.innerHTML = `
    <div class="end-box">
      <div class="end-label">${labelMap[type]}</div>
      <div class="end-name">${title}</div>
      <div class="end-char">${nameMap[type]}</div>
      <div class="end-text">${body}</div>
      ${after}
      <div class="end-actions">
        <button class="m-btn" id="mCol" style="background:#131d30;border-color:#1d2c48;color:#9fb2cc">回忆册</button>
        <button class="m-btn" id="mEnd">重新开始</button>
      </div>
    </div>`;
  box.querySelector('#mCol').onclick = ()=> renderCollection(true);
  box.querySelector('#mEnd').onclick = ()=>{
    $('#modal').classList.remove('on');
    showTitle();
  };
  $('#modal').classList.add('on');
}

function showTitle(){
  $('#titleScreen').classList.add('on');
  $('#hud').style.display = 'none';
  $('#scene').style.display = 'none';
  $('#actions').style.display = 'none';
  const st = collectionStats();
  $('#tHint').innerHTML = `回忆册：${st.got} / ${st.total}<br>每一个深夜，都值得被记住。`;
}
function showGame(){
  $('#titleScreen').classList.remove('on');
  $('#hud').style.display = '';
  $('#scene').style.display = '';
  $('#actions').style.display = '';
}

function start(){
  loadCollection();
  initState();
  $('#btnStart').onclick = ()=>{
    clearSave();
    initState();
    rollWeatherAndEvents();
    S.apMax = computeApMax();
    S.ap = S.apMax;
    S.present = rollVisitors();
    S.logs = [];
    addLog('你接手了这家深夜便利店。第一个夜班。');
    save();
    showGame();
    renderNight();
  };
  $('#btnCollection').onclick = ()=> renderCollection(false);

  const hasSave = load();
  if(hasSave){
    showGame();
    if(S.pendingSettle){
      nextDay();
    }else{
      renderNight();
      if(S.pendingPhoto) tryPhotoScene();
      else tryYuAppear();
    }
  }else{
    showTitle();
  }
}
start();
</script>
